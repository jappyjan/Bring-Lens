services:
  bring-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Put TLS in front of this (Traefik / Caddy / Cloudflare) at
    # bring-proxy.apps.janjaap.de. Internally the proxy speaks plain HTTP
    # on port 80 — expose it to the Docker network only, not to the host.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
