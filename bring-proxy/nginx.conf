# Bring! API CORS-stripping reverse proxy.
#
# Listens on port 80 inside the container and forwards every request to
# https://api.getbring.com/rest/<path> while injecting permissive CORS
# headers. Handles the preflight OPTIONS request directly so Bring never
# sees it.
#
# Host the result behind whatever TLS terminator you already run
# (Traefik, Caddy, Cloudflare, etc.) at bring-proxy.apps.janjaap.de.

server {
    listen 80;
    server_name _;

    # We use a variable in `proxy_pass` below so nginx will re-resolve
    # api.getbring.com via the resolver here instead of caching the DNS
    # lookup at startup forever.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Shared CORS values. List every custom header the Bring Android
    # client (and therefore our app) sends, plus Authorization.
    set $cors_origin  "*";
    set $cors_methods "GET, POST, PUT, DELETE, OPTIONS";
    set $cors_headers "Authorization, Content-Type, X-BRING-API-KEY, X-BRING-CLIENT, X-BRING-APPLICATION, X-BRING-COUNTRY, X-BRING-USER-UUID, X-BRING-PUBLIC-USER-UUID, X-BRING-VERSION, X-BRING-CLIENT-SOURCE";

    # Simple health endpoint so the container has something to ping.
    # NOTE: nginx's `add_header` directive does NOT inherit across
    # location blocks — any `add_header` in a location silently shadows
    # ones in the parent server/http context. So we have to repeat the
    # CORS headers in every location that needs them.
    location = /healthz {
        default_type text/plain;
        add_header Access-Control-Allow-Origin  $cors_origin  always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;
        return 200 "ok\n";
    }

    location / {
        # Answer CORS preflight requests ourselves — no need to forward
        # them to Bring, which wouldn't answer them anyway.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin  always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Max-Age       86400         always;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain; charset=utf-8";
            return 204;
        }

        # Forward to Bring. $request_uri preserves the raw path + query
        # string exactly as the client sent it, so e.g.
        #   /v2/bringauth           -> https://api.getbring.com/rest/v2/bringauth
        #   /bringusers/{u}/lists   -> https://api.getbring.com/rest/bringusers/{u}/lists
        set $bring_host "api.getbring.com";
        proxy_pass https://$bring_host/rest$request_uri;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $bring_host;
        proxy_set_header Host $bring_host;
        # Don't ask for gzip — keeps sub_filter-style tooling simple if
        # you ever want to inspect bodies, and Bring responses are tiny.
        proxy_set_header Accept-Encoding "";

        # Hide the fact that this is a browser request from Bring's
        # WAF (Cloudflare). Without this scrubbing, the request reaches
        # the upstream but is 403'd because it doesn't look anything
        # like the Android client that the X-BRING-CLIENT header claims
        # it is. In nginx, `proxy_set_header X "";` *removes* the header
        # entirely instead of forwarding an empty value.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header User-Agent "Bring!/4.46.0 (Android)";
        # Chrome client hints — none of these are sent by a real Android
        # Bring client and Cloudflare uses them to fingerprint browsers.
        proxy_set_header Sec-Fetch-Dest "";
        proxy_set_header Sec-Fetch-Mode "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header Sec-Fetch-User "";
        proxy_set_header Sec-Ch-Ua "";
        proxy_set_header Sec-Ch-Ua-Mobile "";
        proxy_set_header Sec-Ch-Ua-Platform "";
        proxy_set_header Sec-Ch-Ua-Platform-Version "";
        proxy_set_header DNT "";
        proxy_set_header Upgrade-Insecure-Requests "";

        # Drop anything Bring might send back that looks like CORS, so we
        # don't accidentally emit two Access-Control-Allow-Origin headers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        # Our own CORS headers. `always` ensures they're attached to
        # non-2xx responses (401, 404, 500, ...) too.
        add_header Access-Control-Allow-Origin  $cors_origin  always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
